name = "ea-monitor-live"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Panel estático (public/index.html) servido directamente por el Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Base de datos D1 — el database_id se rellena después de crear la base
# desde el panel de Cloudflare (Workers & Pages > D1 > Create database).
# El nombre puede ser el que quieras, pero mantén el binding "DB" tal cual,
# el código de src/index.js lo usa por ese nombre.
[[d1_databases]]
binding = "DB"
database_name = "ea-monitor-live-db"
database_id = "PENDIENTE-rellenar-tras-crear-la-base-en-Cloudflare"
